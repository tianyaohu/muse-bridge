[project]
name = "muse-bridge"
version = "0.2.0"
description = "Meta Muse to Nori inbox bridge over MCP Streamable HTTP"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["muse_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["muse_bridge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["muse_bridge", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["muse_bridge/limits.py"]
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
