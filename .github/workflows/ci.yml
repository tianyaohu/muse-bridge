name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -e ".[dev]"
      - name: Lint
        run: |
          ruff check muse_bridge/limits.py deploy/docker/entrypoint.py tests/test_limits.py tests/test_http.py tests/test_deploy_config.py test_client.py
          ruff format --check muse_bridge/limits.py deploy/docker/entrypoint.py tests/test_limits.py tests/test_http.py tests/test_deploy_config.py test_client.py
      - name: Typecheck
        run: mypy muse_bridge/limits.py
      - name: Checkout path for core CLI tests
        run: |
          # tests/core launches admin with cwd=/workspace. The runner checkout
          # lives under /home/runner/work, so expose it at that path.
          if [ ! -e /workspace ]; then
            sudo ln -s "$GITHUB_WORKSPACE" /workspace
          fi
      - name: Test
        run: pytest
